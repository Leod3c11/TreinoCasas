name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore original app source
        run: |
          base64 --decode .build/treinocasa-source.zip.b64 > /tmp/treinocasa-source.zip
          unzip -oq /tmp/treinocasa-source.zip 'app/*' 'build.gradle' 'settings.gradle' -d .
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TreinoCasa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
