name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Recover and restore original source archive
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, zipfile
          from pathlib import Path
          encoded = Path(".build/treinocasa-source.zip.b64").read_text().strip()
          expected = 21648
          if len(encoded) != expected:
              excess = len(encoded) - expected
              if excess < 1:
                  raise SystemExit(f"Unexpected archive length: {len(encoded)}")
              recovered = None
              for start in range(len(encoded) - excess + 1):
                  candidate = encoded[:start] + encoded[start + excess:]
                  try:
                      raw = base64.b64decode(candidate, validate=True)
                      with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                          names = archive.namelist()
                          if "app/src/main/assets/index.html" not in names:
                              continue
                          if archive.testzip() is not None:
                              continue
                      recovered = raw
                      print(f"Recovered archive by removing corrupted overlap at offset {start}")
                      break
                  except Exception:
                      continue
              if recovered is None:
                  raise SystemExit("Could not recover the original source archive")
              raw = recovered
          else:
              raw = base64.b64decode(encoded, validate=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt source file: {bad}")
              archive.extractall(".")
          PY
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TreinoCasa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
